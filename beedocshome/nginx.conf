# beedocshome — static marketing site.
# Served by nginx-unprivileged, which listens on 8080 as uid 101.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Probe endpoint for the k8s deployment.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprint-free assets: cache for a day, revalidate after.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
