# beedocshome — static marketing site.
# Served by nginx-unprivileged, which listens on 8080 as uid 101.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Probe endpoint for the k8s deployment.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Asset URLs carry a ?v=<content-hash> stamped by scripts/deploy.sh, so a
    # changed file is a new cache key and the old copy can live forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages revalidate on every load — they are what point at the hashed
    # assets, so they must never be served stale after a deploy.
    # (add_header in a location replaces the server-level set; repeat them.)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
