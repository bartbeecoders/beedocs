apiVersion: v1
kind: ConfigMap
metadata:
  name: beedocs-config
  namespace: beedocs
  labels:
    app.kubernetes.io/name: beedocs
data:
  # Kestrel binds inside the pod; the Service maps 8080 -> NodePort 32095.
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"

  # Both paths live on the PVC mounted at /data so the SQLite store and the
  # uploaded images survive pod restarts and image upgrades.
  BeeDocs__DataPath: "/data/sqlite"
  BeeDocs__UploadsPath: "/data/uploads"
  BeeDocs__AttachmentsPath: "/data/attachments"
  # Optional: protect /api/v1 (external publish API). Prefer a Secret in production.
  # BeeDocs__ApiKey: ""

  # Sign-in. On for this instance: Cloudflare Access decides who reaches it,
  # these accounts decide who may write once they are here (admin / editor /
  # viewer) — see Docs/USERS-AND-ROLES.md. It lives here rather than in
  # appsettings.json so the login wall is a property of the deployment, not of
  # the image.
  BeeDocs__Auth__Enabled: "true"
  BeeDocs__Auth__SessionHours: "168"
  # BeeDocs__Auth__SecureCookie is deliberately left unset. Cloudflare
  # terminates TLS and forwards plain HTTP, so the flag follows a request that
  # does not look secure — but the browser still speaks HTTPS to Cloudflare, so
  # the cookie survives, and leaving it off keeps the plain-HTTP NodePort
  # usable for debugging. Set it to "true" once nothing reaches the NodePort.
  #
  # Still missing: BeeDocs__ApiKey. The MCP sidecar has no session cookie, so
  # with sign-in on every call it makes to the API is a 401 until the key is
  # set here (or, better, from a Secret) and passed to the sidecar as
  # BEEDOCS_API_KEY — see the commented block in deployment.yaml. Setting it
  # also turns the LLM writing help off in the UI, which is why it is a
  # separate decision.
