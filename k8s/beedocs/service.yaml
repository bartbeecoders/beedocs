apiVersion: v1
kind: Service
metadata:
  name: beedocs
  namespace: beedocs
  labels:
    app.kubernetes.io/name: beedocs
spec:
  type: NodePort
  selector:
    app: beedocs
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Public entry point. The Cloudflare Tunnel on the node forwards the
      # BeeDocs hostname to http://<node>:32095 (tunnel config lives outside
      # this repo). Do not change without updating the tunnel ingress rule.
      nodePort: 32095
      protocol: TCP
    - name: mcp
      port: 5090
      targetPort: mcp
      # MCP Streamable HTTP endpoint (/mcp on this port). Kept on its own
      # hostname/port so Cloudflare Access can apply a service-token policy
      # here and an interactive SSO policy to the web UI — agents cannot
      # complete a browser login. See Docs/MCP-HOSTING.md.
      nodePort: 32096
      protocol: TCP
