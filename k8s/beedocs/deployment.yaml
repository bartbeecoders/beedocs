apiVersion: apps/v1
kind: Deployment
metadata:
  name: beedocs
  namespace: beedocs
  labels:
    app: beedocs
    app.kubernetes.io/name: beedocs
spec:
  # Exactly one replica: SQLite is a single-writer file store on a ReadWriteOnce
  # volume. A second pod would contend for the same database file.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate — the new pod must not come up while the old
    # one still holds the SQLite file open on the ReadWriteOnce volume.
    type: Recreate
  selector:
    matchLabels:
      app: beedocs
  template:
    metadata:
      labels:
        app: beedocs
        app.kubernetes.io/name: beedocs
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: beedocs
          image: beecodersregistry.azurecr.io/beedocs:latest
          # The deploy script always pushes :latest, so the tag alone never
          # changes — Always + `rollout restart` is what picks up a new digest.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: beedocs-config
          volumeMounts:
            - name: data
              mountPath: /data
          # First boot opens SQLite and applies the schema, so give startup a
          # generous budget; liveness stays tight once the app is up.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

        # MCP server for AI agents. Same pod as the API on purpose: it reaches
        # BeeDocs over the pod loopback, so the REST API never has to be
        # exposed to the cluster network for its sake.
        - name: mcp
          image: beecodersregistry.azurecr.io/beedocs-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 5090
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HTTP_PORT
              value: "5090"
            # Loopback within the pod — the API container above.
            - name: BEEDOCS_API_URL
              value: "http://localhost:8080"
            # MCP_AUTH_TOKEN is deliberately NOT set: the origin bearer check
            # is disabled, so /mcp accepts every caller that can reach it.
            # There is no Cloudflare Access policy on the MCP hostname either,
            # which means the endpoint is open to the internet with full
            # read/write/delete access to every document. The beedocs-mcp-auth
            # secret is left in the cluster — restore the env block below and
            # re-run ./scripts/deploy-k3s.sh deploy to turn auth back on.
            #
            # - name: MCP_AUTH_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: beedocs-mcp-auth
            #       key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            # Must be numeric and set explicitly. The image's USER is uid 1000
            # (`node`); with only a username the kubelet cannot verify it is
            # non-root and fails with CreateContainerConfigError.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      # No pod-level runAsNonRoot: the API container writes to a PVC backed by
      # k3s local-path (hostPath), which ignores fsGroup, so a non-root UID
      # could not write to /data. The MCP container touches no volume, so it
      # drops privileges individually above.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beedocs-data
