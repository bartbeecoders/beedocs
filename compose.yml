services:
  beedocs:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - beedocs-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BeeDocs__DataPath: /data/sqlite
      BeeDocs__UploadsPath: /data/uploads
      BeeDocs__AttachmentsPath: /data/attachments

volumes:
  beedocs-data:
