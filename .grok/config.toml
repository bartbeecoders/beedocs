# Project-scoped Grok config for BeeDocs
# https://modelcontextprotocol.io — see Docs/MCP-SERVER.md

[mcp_servers.beedocs]
command = "dotnet"
args = [
    "run",
    "--no-launch-profile",
    "--project",
    "src/BeeDocs.Mcp/BeeDocs.Mcp.csproj",
]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.beedocs.env]
BEEDOCS_API_URL = "http://localhost:5080"
